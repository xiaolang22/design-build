global_costmap:
  # 坐标变换
  global_frame: map
  robot_base_frame: base_link
  transform_tolerance: 1.0

  # 更新和发布频率
  update_frequency: 2.0    # 降低更新频率以节省计算资源
  publish_frequency: 2.0

  static_map: false         # 修改：从false改为true，使用SLAM提供的地图
  rolling_window: true    # 修改：从true改为false，禁用滚动窗口

  #全局代价地图尺寸（使用map自带的尺寸参数）
  width: 60.0              # 增加全局代价地图尺寸
  height: 60.0
  resolution: 0.05        #单位m

  track_unknown_space: true   # 一个布尔值，指示是否跟踪未知空间。如果设置为true，则会将未知区域标记为障碍物。（其实common已经设置过了）

  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  # === 新增：静态层详细配置 ===
  static_layer:
    enabled: true
    map_topic: /map                    # 使用cartographer发布的地图话题
    subscribe_to_updates: true         # 订阅地图更新
    unknown_cost_value: -1
    trinary_costmap: true         # 是否使用三值地图（很重要的参数！！！！）
    track_unknown_space: true
    transform_tolerance: 1.0           # 匹配全局的transform_tolerance
    # === 关键修改：降低占据阈值 ===
    occupied_threshold: 50    # 默认是65，降低到50
    free_threshold: 25        # 默认是25，降低到10
    # === 确保静态层不会被resize影响 ===
    always_send_full_costmap: true

  obstacle_layer:
    enabled: true
    combination_method: 1
    track_unknown_space: true # 认为未知区域是障碍物
    # 基础障碍物配置，其他文件会覆盖掉
    obstacle_range: 0.8  # 障碍物检测范围 #修改
    raytrace_range: 0.1  # 障碍物清除范围，清除代价地图中此半径以内的障碍物

    observation_sources: laser_scan_sensor  #使用什么传感器感知障碍物
    laser_scan_sensor: {
      sensor_frame: laser_link,
      data_type: LaserScan,
      topic: scan,
      marking: true,
      clearing: true, #修改
      inf_is_valid: true
    }

  inflation_layer:
    enabled: true
    cost_scaling_factor: 8.0   # 较小的值，代价值衰减更慢，膨胀区域更大
    inflation_radius: 0.3      # 更大的膨胀半径，使得轨迹更远离障碍物

