  - name: 'clear_local_costmap'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'rotate_recovery'
    type: 'rotate_recovery/RotateRecovery'

# 全局代价地图清除配置（防止障碍物层过度堆积导致不能进行全局规划）
clear_global_costmap:
  reset_distance: 0.7
  layer_names: ["obstacle_layer"]  # 只清除障碍物层，不影响静态层
  force_updating: true
  costmap_name: "global_costmap"   # 明确指定全局代价地图

# 局部代价地图清除配置
clear_local_costmap:
  reset_distance: 3.0
  layer_names: ["obstacle_layer"]
  costmap_name: "local_costmap"
